name: Build Redmi AX6 Tiny

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish experimental GitHub pre-release (use only after reviewing artifacts)'
        type: boolean
        required: false
        default: false
  schedule:
    # Sunday 03:17 UTC / 11:17 Hong Kong time. Artifact only; no auto-release.
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ax6-minimal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ImmortalWrt 25.12 / AX6 stock
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write # Required only by optional prerelease step.
    env:
      OPENWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
      OPENWRT_BRANCH: openwrt-25.12
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TZ: Asia/Hong_Kong

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v7.0.1

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync unzip \
            zlib1g-dev file wget swig time curl xz-utils zstd \
            subversion libelf-dev ca-certificates squashfs-tools
          sudo apt-get clean

      - name: Cache compiler outputs
        uses: actions/cache@v6.1.0
        with:
          path: .ccache
          key: ax6-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ax6-ccache-${{ runner.os }}-

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 --single-branch --branch "$OPENWRT_BRANCH" "$OPENWRT_REPO" openwrt
          git -C openwrt log -1 --format='%h %ci %s'
          ccache -M 2G

      - name: Install feeds and enforce tiny-core dependency
        working-directory: openwrt
        run: bash ../scripts/prepare.sh

      - name: Configure AX6 stock profile
        working-directory: openwrt
        run: |
          cp ../configs/redmi-ax6-stock.config .config
          make defconfig
          bash ../scripts/check-config.sh .config

      - name: Audit Qualcomm datapath and stock layout
        working-directory: openwrt
        run: bash ../scripts/audit-datapath.sh .config ../dist/DATAPATH-AUDIT.md

      - name: Download source archives
        working-directory: openwrt
        run: |
          make download -j4
          find dl -type f -size -1024c -print
          df -h

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j2 V=sc

      - name: Audit and collect images
        working-directory: openwrt
        run: bash ../scripts/collect.sh ../dist

      # Each firmware gets its own artifact: ZIP size is NOT a flashable image size.
      - name: Upload stock sysupgrade image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-stock-sysupgrade-${{ github.run_number }}
          path: dist/*-sysupgrade.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload stock factory UBI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-stock-factory-${{ github.run_number }}
          path: dist/*-factory.ubi
          if-no-files-found: error
          retention-days: 14

      - name: Upload manifest, configuration and build report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-stock-metadata-${{ github.run_number }}
          path: |
            dist/*.manifest
            dist/*.buildinfo
            dist/*.json
            dist/build.config
            dist/BUILD-REPORT.md
            dist/DATAPATH-AUDIT.md
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish optional experimental pre-release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ax6-stock-test-${{ github.run_number }}
          name: Redmi AX6 stock experimental build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body_path: dist/BUILD-REPORT.md
          files: dist/*
