name: Experimental PPE-only AX6 stock (not flashable)

on:
  pull_request:
    paths:
      - '.github/workflows/ppe-only-experiment.yml'
      - 'scripts/prepare-ppe-experiment.sh'
      - 'scripts/check-ppe-config.sh'
      - 'configs/redmi-ax6-ppe-only-stock.config'
  workflow_dispatch:
    inputs:
      full_compile:
        description: 'Compile experimental PPE-only firmware (report only, NO firmware upload)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ax6-ppe-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-guard:
    name: PPE upstream source + AX6 stock guard
    outputs:
      upstream_sha: ${{ steps.version.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch PPE upstream
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss \
            https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
          git -C ppe-source log -1 --format='%H %ci %s'
      - name: Pin upstream source revision
        id: version
        run: echo "sha=$(git -C ppe-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify AX6 stock port and PPE-only selectors
        working-directory: ppe-source
        run: |
          bash ../scripts/prepare-ppe-experiment.sh
          test -f target/linux/qualcommax/dts/ipq8071-ax6-stock.dts
          grep -Fq 'compatible = "redmi,ax6-stock"' target/linux/qualcommax/dts/ipq8071-ax6-stock.dts
          grep -Fq 'compatible = "qcom,smem-part"' target/linux/qualcommax/dts/ipq8071-ax6-stock.dts
          grep -Fq 'DEVICE_DTS := ipq8071-ax6-stock' target/linux/qualcommax/image/ipq807x.mk
          grep -Fq 'redmi,ax6-stock)' target/linux/qualcommax/ipq807x/base-files/lib/upgrade/platform.sh
          for p in \
            target/linux/qualcommax/ipq807x/base-files/etc/board.d/02_network \
            target/linux/qualcommax/ipq807x/base-files/etc/board.d/01_leds \
            target/linux/qualcommax/ipq807x/base-files/etc/hotplug.d/firmware/11-ath11k-caldata \
            package/boot/uboot-tools/uboot-envtools/files/qualcommax_ipq807x; do
            grep -Fq 'redmi,ax6-stock' "$p"
          done
          cp ../configs/redmi-ax6-ppe-only-stock.config .config
          bash ../scripts/check-ppe-config.sh .config
          grep -Fqx 'CONFIG_QCOM_EDMA=y' target/linux/qualcommax/ipq807x/config-default
          grep -Fqx 'CONFIG_QCOM_80211AX_PPE=y' target/linux/qualcommax/ipq807x/config-default
          test "$(grep -c '^TARGET_DEVICES += redmi_ax6-stock$' target/linux/qualcommax/image/ipq807x.mk)" -eq 1
          echo 'Source-level PPE-only preflight PASSED. Flash safety NOT verified.'

  full-build:
    name: PPE-only feasibility compile (metadata only)
    needs: source-guard
    # Explicit opt-in only: manual dispatch OR same-repo PR title marker.
    # PR title marker can be removed once the one-off run is queued.
    # No firmware images are uploaded or published under either trigger.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_compile) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[PPE-FULL-COMPILE]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h
      - name: Install toolchain prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools rsync unzip \
            zlib1g-dev file wget swig time curl xz-utils zstd \
            subversion libelf-dev ca-certificates squashfs-tools
          sudo apt-get clean
      - name: Clone upstream PPE source
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss \
            https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
          mkdir -p ppe-report
          # The preflight and compile must operate on the same upstream revision.
          expected='${{ needs.source-guard.outputs.upstream_sha }}'
          actual="$(git -C ppe-source rev-parse HEAD)"
          [[ -n "$expected" && "$actual" == "$expected" ]] || {
            echo "ERROR: upstream PPE branch moved after preflight ($expected -> $actual). Re-run." >&2
            exit 1
          }
          echo "$actual" > ppe-report/PPE-SOURCE-SHA.txt
      - name: Prepare guarded stock profile and feeds
        working-directory: ppe-source
        run: |
          bash ../scripts/prepare-ppe-experiment.sh
          sha256sum target/linux/qualcommax/dts/ipq8071-ax6-stock.dts \
            target/linux/qualcommax/image/ipq807x.mk \
            target/linux/qualcommax/ipq807x/base-files/lib/upgrade/platform.sh \
            > ../ppe-report/STOCK-PORT-SHA256SUMS
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Generate and validate PPE-only configuration
        working-directory: ppe-source
        run: |
          cp ../configs/redmi-ax6-ppe-only-stock.config .config
          make defconfig
          bash ../scripts/check-ppe-config.sh .config
          bash ../scripts/audit-datapath.sh .config ../ppe-report/DATAPATH-AUDIT.md
          cp .config ../ppe-report/build.config
          grep -E '^CONFIG_(QCOM_EDMA|QCOM_80211AX_PPE|PACKAGE_kmod-nss-wifi-drv)=' .config || true
      - name: Download sources
        working-directory: ppe-source
        run: make download -j4
      - name: Compile PPE-only feasibility image
        working-directory: ppe-source
        run: make -j2 V=s
      - name: Audit images (NEVER publish them)
        working-directory: ppe-source
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          target=bin/targets/qualcommax/ipq807x
          factory=("$target"/*redmi_ax6-stock*squashfs-factory.ubi)
          sysupgrade=("$target"/*redmi_ax6-stock*squashfs-sysupgrade.bin)
          (( ${#factory[@]} == 1 && ${#sysupgrade[@]} == 1 )) || {
            echo 'ERROR: exactly one AX6 stock factory.ubi and sysupgrade.bin required' >&2
            exit 1
          }
          {
            echo '# PPE-only hardware feasibility experiment'
            echo
            echo 'STATUS: **NOT VERIFIED FOR FLASHING**. No image uploaded.'
            echo "Upstream revision: $(git rev-parse HEAD)"
            echo "Factory image: $(basename "${factory[0]}")"
            echo "Sysupgrade image: $(basename "${sysupgrade[0]}")"
            echo
            python3 ../scripts/check-stock-image.py "${sysupgrade[0]}" "${factory[0]}"
          } > ../ppe-report/IMAGE-AUDIT.md
          cp "$target"/*.manifest ../ppe-report/
          echo 'PPE-only feasibility compile and image size/structure checks passed.'
          cat ../ppe-report/IMAGE-AUDIT.md
      - name: Upload metadata ONLY (never firmware binaries)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ppe-only-not-flashable-${{ github.run_number }}
          path: ppe-report/
          if-no-files-found: warn
          retention-days: 14
