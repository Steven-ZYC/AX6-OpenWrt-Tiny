name: Build and release AX6 Tiny + Tiny Plus (stock NAND)

on:
  pull_request:
    paths:
      - '.github/workflows/release-variants.yml'
      - 'configs/redmi-ax6-ppe-tiny-stock.config'
      - 'configs/redmi-ax6-ppe-tiny-plus-stock.config'
      - 'scripts/prepare-ppe-tiny.sh'
      - 'scripts/prepare-ppe-experiment.sh'
      - 'scripts/verify-ax6-variant.sh'
      - 'scripts/stage-ax6-variant.sh'
      - 'scripts/check-stock-image.py'
      - 'files/**'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: v0.1.0-rc1
        description: 'Tag for BOTH variants (e.g. v0.1.0-rc1)'
      publish_prerelease:
        type: boolean
        default: false
        required: true
        description: 'On main only, publish one experimental GitHub Release with all four images'

permissions:
  contents: read

concurrency:
  group: ax6-two-variants-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: AX6 ${{ matrix.variant }} / stock layout
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [tiny, tiny-plus]
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Hong_Kong
      # Pin the already compiled PPE source; changing the source requires review.
      PPE_SOURCE_SHA: 7d65a3ed836a0071e2f19a5944682f457e02efe0
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Install toolchain prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 \
            python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget swig time curl xz-utils zstd subversion libelf-dev \
            ca-certificates squashfs-tools
          sudo apt-get clean

      - name: Checkout vetted PPE source revision
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss \
            https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
          if [[ "$(git -C ppe-source rev-parse HEAD)" != "$PPE_SOURCE_SHA" ]]; then
            git -C ppe-source fetch --depth=1 origin "$PPE_SOURCE_SHA"
            git -C ppe-source checkout --detach "$PPE_SOURCE_SHA"
          fi
          [[ "$(git -C ppe-source rev-parse HEAD)" == "$PPE_SOURCE_SHA" ]]
          mkdir -p reports
          echo "$PPE_SOURCE_SHA" > reports/PPE-SOURCE-SHA.txt

      - name: Prepare stock DTS, PPE/NSS and LuCI feeds
        working-directory: ppe-source
        run: |
          bash ../scripts/prepare-ppe-tiny.sh
          cp ../configs/redmi-ax6-ppe-tiny-${{ matrix.variant == 'tiny-plus' && 'plus-' || '' }}stock.config .config

      - name: Verify package selection and Chinese translation
        working-directory: ppe-source
        run: |
          make defconfig
          bash ../scripts/verify-ax6-variant.sh config '${{ matrix.variant }}' .config
          bash ../scripts/audit-datapath.sh .config ../reports/DATAPATH-AUDIT.md
          cp .config ../reports/build.config
          git rev-parse HEAD > ../reports/SOURCE-SHA.txt
          for feed in feeds/luci feeds/packages feeds/nss; do
            echo "$feed $(git -C "$feed" rev-parse HEAD)" >> ../reports/FEED-SHAS.txt
          done
          cp ../ppe-tiny-report/IMMORTALWRT-LUCI-SHA.txt ../reports/IMMORTALWRT-LUCI-SHA.txt

      - name: Download sources
        working-directory: ppe-source
        run: make download -j4

      - name: Full firmware compile
        working-directory: ppe-source
        run: make -j2 V=sc

      - name: Verify final manifest and 28 MiB stock NAND gate
        working-directory: ppe-source
        run: |
          bash ../scripts/stage-ax6-variant.sh '${{ matrix.variant }}' \
            bin/targets/qualcommax/ipq807x \
            ../staged/'${{ matrix.variant }}' ../reports
          cp ../reports/PPE-SOURCE-SHA.txt ../staged/'${{ matrix.variant }}'/
          cp ../reports/FEED-SHAS.txt ../staged/'${{ matrix.variant }}'/
          cp ../reports/IMMORTALWRT-LUCI-SHA.txt ../staged/'${{ matrix.variant }}'/
          cp ../reports/build.config ../staged/'${{ matrix.variant }}'/build.config

      - name: Upload variant for PR review or release assembly
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-release-${{ matrix.variant }}-${{ github.run_id }}
          path: staged/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish BOTH variants as one experimental pre-release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ax6-release-*-${{ github.run_id }}
          path: bundles/
          merge-multiple: false

      - name: Verify identical sources, manifests and the complete four-image set
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]] || {
            echo 'ERROR: experimental tag must look like v0.1.0-rc1' >&2
            exit 1
          }
          test -d "bundles/ax6-release-tiny-${{ github.run_id }}"
          test -d "bundles/ax6-release-tiny-plus-${{ github.run_id }}"
          mkdir -p release
          for variant in tiny tiny-plus; do
            source_dir="bundles/ax6-release-$variant-${{ github.run_id }}"
            test -s "$source_dir/AX6-$variant-factory.ubi"
            test -s "$source_dir/AX6-$variant-sysupgrade.bin"
            test -s "$source_dir/AX6-$variant.manifest"
            (cd "$source_dir" && sha256sum -c "SHA256SUMS-$variant")
            bash scripts/verify-ax6-variant.sh manifest "$variant" "$source_dir/AX6-$variant.manifest"
            cp "$source_dir/AX6-$variant-factory.ubi" "release/AX6-$variant-$TAG-factory.ubi"
            cp "$source_dir/AX6-$variant-sysupgrade.bin" "release/AX6-$variant-$TAG-sysupgrade.bin"
            cp "$source_dir/AX6-$variant.manifest" "release/AX6-$variant-$TAG.manifest"
            cp "$source_dir/AX6-$variant-IMAGE-AUDIT.md" "release/AX6-$variant-$TAG-IMAGE-AUDIT.md"
          done
          a="bundles/ax6-release-tiny-${{ github.run_id }}"
          b="bundles/ax6-release-tiny-plus-${{ github.run_id }}"
          for source_file in PPE-SOURCE-SHA.txt FEED-SHAS.txt IMMORTALWRT-LUCI-SHA.txt; do
            cmp "$a/$source_file" "$b/$source_file" || {
              echo "ERROR: two variants built from different sources: $source_file" >&2
              exit 1
            }
            cp "$a/$source_file" "release/$source_file"
          done
          (cd release && sha256sum ./*.ubi ./*.bin > SHA256SUMS)
          test "$(find release -maxdepth 1 -type f -name '*.ubi' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 2
          cat > release/RELEASE-NOTES.md <<EOF
          ## Redmi AX6 stock NAND · $TAG · experimental

          **Not tested on a physical router. Not approved as flash-safe.**
          Do not flash until stock partition, UBI bad-block, boot-slot,
          MAC/calibration and rollback procedures have been reviewed.

          | Variant | Contents |
          | --- | --- |
          | Tiny | Qualcomm PPE/EDMA, NSS Wi-Fi, LuCI/Argon (zh-CN), firewall4; NO proxy packages |
          | Tiny Plus | Same hardware base + HomeProxy, sing-box-tiny, nft TProxy and zh-CN |

          Each variant has both **factory.ubi** and **sysupgrade.bin**.
          These serve different install paths; they are NOT interchangeable.
          Check the AX6 original stock layout, never the expanded-layout device.

          Two builds must pass the 28 MiB factory UBI hard gate,
          per-variant manifest audit and matching source/feeds audit.
          Actual hardware PPE/NSS offload and proxy behavior remain untested.
          SHA256SUMS covers all four firmware binaries.
          EOF

      - name: Create release only when all four verified artifacts exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$TAG" release/*.ubi release/*.bin \
            release/*.manifest release/*IMAGE-AUDIT.md \
            release/SHA256SUMS release/*SHA.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Redmi AX6 Tiny & Tiny Plus $TAG (experimental)" \
            --notes-file release/RELEASE-NOTES.md
