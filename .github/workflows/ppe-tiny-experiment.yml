name: Experimental Redmi AX6 PPE + NSS Wi-Fi + Tiny (stock layout)

on:
  pull_request:
    paths:
      - '.github/workflows/ppe-tiny-experiment.yml'
      - 'configs/redmi-ax6-ppe-tiny-plus-stock.config'
      - 'scripts/prepare-ppe-tiny.sh'
      - 'scripts/check-ppe-tiny-config.sh'
      - 'scripts/audit-ppe-tiny-manifest.sh'
      - 'scripts/prepare-ppe-experiment.sh'
      - 'scripts/check-stock-image.py'
  workflow_dispatch:
    inputs:
      full_compile:
        type: boolean
        default: false
        required: true
        description: 'Build combined image, audit hard stock flash-size gate and upload experimental UBI/BIN'

permissions:
  contents: read

concurrency:
  group: ax6-ppe-tiny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-guard:
    name: PPE Tiny Plus source/feed/Kconfig check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ppe_sha: ${{ steps.version.outputs.ppe_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install source-check prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git gawk gettext python3
      - name: Clone PPE source
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
      - name: Record pinned PPE source
        id: version
        run: echo "ppe_sha=$(git -C ppe-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare PPE and Tiny feeds with guards
        working-directory: ppe-source
        run: bash ../scripts/prepare-ppe-tiny.sh
      - name: Apply config and confirm all requested packages
        working-directory: ppe-source
        run: |
          cp ../configs/redmi-ax6-ppe-tiny-plus-stock.config .config
          make defconfig
          bash ../scripts/check-ppe-tiny-config.sh .config
          bash ../scripts/audit-datapath.sh .config ../ppe-tiny-report/DATAPATH-AUDIT.md
          cp .config ../ppe-tiny-report/build.config
      - name: Upload source feasibility metadata
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ppe-tiny-source-audit-${{ github.run_number }}
          path: ppe-tiny-report/
          if-no-files-found: warn
          retention-days: 14

  full-build:
    name: PPE Tiny FULL compile (experimental images; NOT flash verified)
    needs: source-guard
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_compile) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[PPE-TINY-FULL]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget swig time curl \
            xz-utils zstd subversion libelf-dev ca-certificates squashfs-tools
          sudo apt-get clean
      - name: Clone SAME PPE source as source guard
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
          actual="$(git -C ppe-source rev-parse HEAD)"
          expected='${{ needs.source-guard.outputs.ppe_sha }}'
          [[ -n "$expected" && "$actual" == "$expected" ]] || {
            echo "ERROR: upstream PPE branch changed since preflight; rerun." >&2
            exit 1
          }
          mkdir -p ppe-tiny-report
          echo "$actual" > ppe-tiny-report/PPE-SOURCE-SHA.txt
      - name: Prepare PPE stock layout, NSS feed, LuCI overlay and tiny core
        working-directory: ppe-source
        run: bash ../scripts/prepare-ppe-tiny.sh
      - name: Generate and validate final package selection
        working-directory: ppe-source
        run: |
          cp ../configs/redmi-ax6-ppe-tiny-plus-stock.config .config
          make defconfig
          bash ../scripts/check-ppe-tiny-config.sh .config
          bash ../scripts/audit-datapath.sh .config ../ppe-tiny-report/DATAPATH-AUDIT.md
          cp .config ../ppe-tiny-report/build.config
          for feed in feeds/luci feeds/packages feeds/nss; do
            echo "$feed $(git -C "$feed" rev-parse HEAD)" >> ../ppe-tiny-report/FEED-SHAS.txt
          done
      - name: Download all sources
        working-directory: ppe-source
        run: make download -j4
      - name: Compile merged PPE + Tiny
        working-directory: ppe-source
        run: make -j2 V=sc
      - name: Verify firmware size, structure and actual package manifest
        working-directory: ppe-source
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          target=bin/targets/qualcommax/ipq807x
          factory=("$target"/*redmi_ax6-stock*squashfs-factory.ubi)
          sysupgrade=("$target"/*redmi_ax6-stock*squashfs-sysupgrade.bin)
          (( ${#factory[@]} == 1 && ${#sysupgrade[@]} == 1 )) || {
            echo 'ERROR: expected exactly one AX6 stock UBI and sysupgrade BIN' >&2
            exit 1
          }
          bash ../scripts/audit-ppe-tiny-manifest.sh "$target" ../ppe-tiny-report
          python3 ../scripts/check-stock-image.py "${sysupgrade[0]}" "${factory[0]}" > ../ppe-tiny-report/IMAGE-AUDIT.md
          mkdir -p ../ppe-tiny-dist
          cp "${factory[0]}" "${sysupgrade[0]}" ../ppe-tiny-dist/
          (cd ../ppe-tiny-dist && sha256sum ./* > ../ppe-tiny-report/SHA256SUMS)
          printf 'EXPERIMENTAL ONLY - PPE, NSS Wi-Fi, stock flash/boot, MAC and TProxy not hardware tested.\n' > ../ppe-tiny-report/UNVERIFIED-READ-ME-FIRST.txt
          cat ../ppe-tiny-report/IMAGE-AUDIT.md
      - name: Upload Factory UBI (experimental and NOT flashing certified)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-ppe-tiny-EXPERIMENTAL-factory-${{ github.run_number }}
          path: ppe-tiny-dist/*-factory.ubi
          if-no-files-found: error
          retention-days: 14
      - name: Upload sysupgrade BIN (experimental and NOT flashing certified)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-ppe-tiny-EXPERIMENTAL-sysupgrade-${{ github.run_number }}
          path: ppe-tiny-dist/*-sysupgrade.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload complete audit metadata
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ax6-ppe-tiny-metadata-${{ github.run_number }}
          path: ppe-tiny-report/
          if-no-files-found: warn
          retention-days: 14
